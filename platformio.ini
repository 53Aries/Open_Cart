; Open_Cart: ESP32-S3 DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM) + ADS1220
; Default build has Wi-Fi web + scoreboard. ISOBUS is opt-in (see [env:s3_isobus]).
;
; Versions are pinned so a rebuild uses exactly the same toolchain and libraries. Change them on
; purpose and test on hardware: a newer ESP-IDF could change NVS (settings and unload history).

[common]
build_flags =
    -std=gnu++17

[env:s3]
; pioarduino platform 55.03.38-1 (ESP-IDF 5.5.4)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
build_type = release
extra_scripts = pre:scripts/version.py
build_flags =
    ${common.build_flags}
    -DENABLE_ISOBUS_BUILD=0

; Same firmware plus the AgIsoStack++ VT client.
; AgIsoStack++ docs target a classic ESP32; verify the S3 works before relying on this.
[env:s3_isobus]
extends = env:s3
lib_deps = https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#ad60bb7bba59eb652864d3ced5d3fde64da20483
build_flags =
    ${common.build_flags}
    -DENABLE_ISOBUS_BUILD=1
